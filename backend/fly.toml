# Fly.io configuration for Mike backend
# Deploy: fly launch (first time) or fly deploy (subsequent)
# Docs:   https://fly.io/docs/reference/configuration/

app = "mike-backend"
primary_region = "arn"   # Stockholm — closest to Denmark

[build]

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https   = true
  auto_stop_machines   = false   # Keep alive — needed for in-process cron + fast response
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval     = "15s"
    method       = "GET"
    path         = "/health"
    timeout      = "2s"

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 100
    hard_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = 256
